name: Update ThaiWater Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rainfall data
        run: |
          curl --fail --retry 3 \
          "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h" \
          -o latest_rainfall.json

      - name: Download water level data
        run: |
          curl --fail --retry 3 \
          "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load" \
          -o latest_waterlevel.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_rainfall.json latest_waterlevel.json
          git diff --cached --quiet || git commit -m "Update ThaiWater data"
          git push
